name: 삼척 키움지도 - 접근·추출 시험

on:
  schedule:
    - cron: '50 23 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: samcheok-access-check-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 이전 최신 결과 제거
        run: rm -f results/latest.md results/latest.json

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 판정 회귀시험
        run: python -m unittest discover -s tests -v

      - name: 접근·추출 시험 실행
        run: python scripts/check_access.py

      - name: 실행 결과 요약
        if: always()
        run: |
          if [ -f results/latest.md ]; then
            cat results/latest.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '결과 파일이 생성되지 않았습니다. 앞 단계 로그를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 결과 파일 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: access-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            results/
            state/
          if-no-files-found: warn
          retention-days: 14

      - name: 결과와 비교 기준 커밋
        if: success()
        continue-on-error: true
        run: |
          git config user.name 'samcheok-access-check-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add results/ state/
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: 접근 시험 결과 갱신 ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
          git push
